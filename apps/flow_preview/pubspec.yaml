name: flow_preview
description: "Browser preview for HCM flow-builder configs. Runs the real
  digit_flow_builder and digit_forms_engine against an in-memory database with
  invented sample data. Not the field worker app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  auto_route: ^8.3.0
  collection: ^1.18.0
  digit_crud_bloc: ^0.1.0
  digit_data_model: ^1.4.0
  digit_flow_builder: ^0.0.1
  digit_forms_engine: ^0.1.1
  digit_formula_parser: ^1.0.0
  digit_scanner: ^1.0.6
  digit_ui_components: ^0.3.2
  dio: ^5.4.3+1
  flutter_bloc: ^8.1.5
  intl: ^0.19.0
  isar: ^3.1.0+1
  location: ^6.0.2
  shared_preferences: ^2.2.3
  web: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Use the in-repo packages, as the field worker app does, so the preview always
# renders with the code on this branch.
dependency_overrides:
  digit_ui_components:
    git:
      url: https://github.com/egovernments/DIGIT-UI-LIBRARIES
      path: flutter/digit-ui-components/digit_components
      ref: UI/ux-audit-hcm-app-2005
  digit_crud_bloc:
    path: ../../packages/digit_crud_bloc
  digit_data_converter:
    path: ../../packages/digit_data_converter
  digit_data_model:
    path: ../../packages/digit_data_model
  digit_flow_builder:
    path: ../../packages/digit_flow_builder
  digit_forms_engine:
    path: ../../packages/digit_forms_engine
  digit_formula_parser:
    path: ../../packages/digit_formula_parser
  digit_scanner:
    path: ../../packages/digit_scanner
  # Same versions as the field worker app: digit_data_model's generated Drift
  # code targets drift 2.18, and sqlite3.wasm in web/ must match sqlite3.
  drift: 2.18.0
  sqlite3: 2.4.5
  # Pins carried over from the field worker app's pubspec_overrides.yaml.
  flutter_dropzone_platform_interface: 2.0.6
  file_selector_linux: ^0.9.2
  file_selector_platform_interface: ^2.6.2
  camera_android_camerax: 0.6.7

flutter:
  uses-material-design: true
  assets:
    - assets/examples/
