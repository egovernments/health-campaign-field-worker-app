server {
    listen 80;
    root /var/web;
    # Behind the cluster ingress: keep redirects relative to the public host.
    absolute_redirect off;

    # Headers for every response (no add_header in the locations below, so
    # they all inherit these).
    #
    # Flutter 3.22 file names are not content-hashed (main.dart.js), so
    # nothing may be cached without revalidation: browsers send If-None-Match
    # and get a cheap 304 until a new build is deployed.
    add_header Cache-Control "no-cache" always;
    # Only the console (same origin) may frame the preview; the postMessage
    # protocol also accepts the same origin only.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    location = /flow-preview {
        return 301 /flow-preview/;
    }

    # Liveness/readiness probe.
    location = /flow-preview/health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # sqlite3.wasm and CanvasKit must be application/wasm for streaming
    # compilation; default_type covers an nginx whose mime.types lacks wasm.
    location ~ ^/flow-preview/.+\.wasm$ {
        default_type application/wasm;
    }

    location /flow-preview/ {
        try_files $uri $uri/ /flow-preview/index.html;
    }
}
