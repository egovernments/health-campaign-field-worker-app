#
# Docker build config, same format as DIGIT-Frontend/build/build-config.yml.
# Built by .github/workflows/build.yaml ("Build Pipeline": Run workflow, pick
# the branch and the pipeline name, e.g. flow-preview).
#
# config:
# -   name: < Name of the job, foo/bar would create job named bar inside folder foo >
#     build:
#     - work-dir: < Working directory of the app to be built >
#       dockerfile: < Path to the dockerfile, optional, assumes dockerfile in working directory if not provided >
#       image-name: < Docker image name  >
#
config:
  # Flutter web preview of flow configs, embedded by the campaign console
  # (workbench-ui); served at /flow-preview/ on the same domain.
  # work-dir is the build context: the repository root.
  - name: builds/health-campaign-field-worker-app/flow-preview
    build:
      - work-dir: .
        dockerfile: apps/flow_preview/docker/Dockerfile
        image-name: hcm-flow-preview
