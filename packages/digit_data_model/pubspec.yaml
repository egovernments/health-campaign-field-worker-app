name: digit_data_model
description: The digit_data_model package is a data modeling library. It defines various classes, enums, and functions.
version: 1.2.0-dev.2-console
homepage: https://github.com/egovernments/health-campaign-field-worker-app/tree/master/packages/digit_data_model
repository: https://github.com/egovernments/health-campaign-field-worker-app

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  digit_ui_components:
   path: ../../../digit_eco/digit_components

  flutter_bloc: ^8.1.5
  freezed_annotation: ^3.1.0
  dart_mappable: ^4.2.0
  drift: ^2.29.0
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.4.0
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  recase: ^4.1.0
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  dio: ^5.4.3+1
  mocktail: ^1.0.3
  collection: ^1.19.0
  encrypt: ^5.0.3
  archive: ^3.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^3.1.0
  build_runner: ^2.7.1
  frontend_server_client: ^4.0.0
  json_serializable: ^6.4.0
  drift_dev: ^2.29.0
  bloc_test: ^9.1.0
  dart_mappable_builder:
   path: ../dart_mappable_builder
